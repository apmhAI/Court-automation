# GitHub — for reading/writing JSON files (clients, results, users)
GITHUB_TOKEN  = "ghp_your_token_here"
GITHUB_REPO   = "your-username/court-automation"
GITHUB_BRANCH = "main"

# SMTP — for sending password reset emails
# Use the same email credentials already in court_automation.py
SMTP_HOST     = "smtp.office365.com"
SMTP_PORT     = "587"
SMTP_EMAIL    = "vedika@apmh.in"
SMTP_PASSWORD = "your_email_password_here"
