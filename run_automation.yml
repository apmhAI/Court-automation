name: Run Court Automation

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Date (DD-MM-YYYY)'
        required: true
        type: string
      courts:
        description: 'Courts — comma-separated (NCLT,NCLAT,SCI,BHC)'
        required: true
        type: string
      requested_at:
        description: 'Requested at (display only)'
        required: false
        type: string

jobs:
  automate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python setup ────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 3. System dependencies (Tesseract + Poppler for PDF/OCR) ──────────
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr poppler-utils

      # ── 4. Python dependencies ─────────────────────────────────────────────
      - name: Install Python dependencies
        run: pip install -r requirements-automation.txt

      # ── 5. Playwright browser ──────────────────────────────────────────────
      - name: Install Playwright Chromium
        run: python -m playwright install chromium --with-deps

      # ── 6. Pull latest clients.json ────────────────────────────────────────
      - name: Pull clients.json from GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PYEOF'
          import json, base64, requests, os
          from pathlib import Path

          token = os.environ['GH_TOKEN']
          repo  = os.environ['REPO']
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          r = requests.get(
              f"https://api.github.com/repos/{repo}/contents/clients.json",
              headers=headers
          )
          if r.ok:
              data = json.loads(base64.b64decode(r.json()["content"]))
              Path("clients.json").write_text(
                  json.dumps(data, indent=2, ensure_ascii=False), encoding="utf-8"
              )
              print(f"clients.json updated ({len(data.get('client_list',[]))} NCLT clients)")
          else:
              print("Warning: could not fetch clients.json — using local copy")
          PYEOF

      # ── 7. Mark run as running ─────────────────────────────────────────────
      - name: Mark run as running
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PYEOF'
          import json, base64, requests, os
          from datetime import datetime

          token = os.environ['GH_TOKEN']
          repo  = os.environ['REPO']
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          r = requests.get(
              f"https://api.github.com/repos/{repo}/contents/run_request.json",
              headers=headers
          )
          data = r.json()
          sha  = data["sha"]
          rr   = json.loads(base64.b64decode(data["content"]))
          rr["status"]     = "running"
          rr["started_at"] = datetime.now().strftime("%d %b %Y %I:%M %p")
          encoded = base64.b64encode(
              json.dumps(rr, indent=2).encode()
          ).decode()
          requests.put(
              f"https://api.github.com/repos/{repo}/contents/run_request.json",
              headers=headers,
              json={"message": "Mark as running (GitHub Actions)",
                    "content": encoded, "sha": sha, "branch": "main"}
          )
          print("run_request.json → running")
          PYEOF

      # ── 8. Run automation ──────────────────────────────────────────────────
      - name: Run court automation
        run: |
          DATE="${{ inputs.date }}"
          COURTS="${{ inputs.courts }}"
          FLAGS=""
          IFS=',' read -ra COURT_LIST <<< "$COURTS"
          for court in "${COURT_LIST[@]}"; do
            court=$(echo "$court" | tr -d ' ')
            case $court in
              NCLT)  FLAGS="$FLAGS --nclt"  ;;
              NCLAT) FLAGS="$FLAGS --nclat" ;;
              SCI)   FLAGS="$FLAGS --sci"   ;;
              BHC)   FLAGS="$FLAGS --bhc"   ;;
            esac
          done
          echo "Running: python court_automation.py --date $DATE $FLAGS --no-prompt"
          python court_automation.py --date "$DATE" $FLAGS --no-prompt

      # ── 9. Upload debug screenshot (always, so we can see what NCLT served) ──
      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: |
            nclt_page_debug.png
            bhc_no_rows.png
          if-no-files-found: ignore

      # ── 10. Push results + mark done (always runs, even on failure) ────────
      - name: Push results and mark done
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_DATE: ${{ inputs.date }}
        run: |
          python - <<'PYEOF'
          import json, base64, requests, os
          from datetime import datetime
          from pathlib import Path

          token = os.environ['GH_TOKEN']
          repo  = os.environ['REPO']
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def gh_get(path):
              r = requests.get(
                  f"https://api.github.com/repos/{repo}/contents/{path}",
                  headers=headers
              )
              if not r.ok:
                  return None, None
              d = r.json()
              return json.loads(base64.b64decode(d["content"])), d["sha"]

          def gh_put(path, content, sha, msg):
              encoded = base64.b64encode(
                  json.dumps(content, indent=2, ensure_ascii=False).encode()
              ).decode()
              payload = {"message": msg, "content": encoded, "branch": "main"}
              if sha:
                  payload["sha"] = sha
              r = requests.put(
                  f"https://api.github.com/repos/{repo}/contents/{path}",
                  headers=headers, json=payload
              )
              if r.ok:
                  print(f"Pushed {path}")
              else:
                  print(f"Failed to push {path}: {r.status_code} {r.text[:200]}")

          # Push last_results.json
          # IMPORTANT: the checked-out repo already contains last_results.json
          # (from a previous run). We must NOT push it unless the date matches
          # the current run — otherwise stale data from a previous date shows in the UI.
          requested_date = os.environ.get("RUN_DATE", "")
          results_path = Path("last_results.json")
          if results_path.exists():
              results_data = json.loads(results_path.read_text(encoding="utf-8"))
              results_date = results_data.get("date", "")
              if results_date != requested_date:
                  print(f"WARNING: last_results.json has date '{results_date}' but run was for '{requested_date}' — pushing empty results to avoid showing stale data")
                  results_data = {
                      "date": requested_date,
                      "generated": datetime.now().strftime("%d %b %Y %I:%M %p"),
                      "total": 0,
                      "entries": []
                  }
              _, old_sha = gh_get("last_results.json")
              gh_put("last_results.json", results_data, old_sha,
                     f"Results {results_data.get('total', 0)} match(es)")
          else:
              print("last_results.json not found — pushing empty results")
              empty = {
                  "date": requested_date,
                  "generated": datetime.now().strftime("%d %b %Y %I:%M %p"),
                  "total": 0,
                  "entries": []
              }
              _, old_sha = gh_get("last_results.json")
              gh_put("last_results.json", empty, old_sha, f"Empty results for {requested_date}")

          # Mark run_request.json as done
          rr, rr_sha = gh_get("run_request.json")
          if rr:
              rr["status"]       = "done"
              rr["completed_at"] = datetime.now().strftime("%d %b %Y %I:%M %p")
              gh_put("run_request.json", rr, rr_sha, "Run complete (GitHub Actions)")
          PYEOF
